name: Publish Thor Ergo 1.0

on:
  push:
    branches: [main]
    paths:
      - Thor-Ergo-1.0-Publish.zip
      - .github/workflows/publish-thor-ergo.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thor-ergo-publication-1.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'seekingalphacrawler/Thor-Ergo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out this fork
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify and prepare the exact publication bundle
        run: python3 .github/scripts/publish_thor_ergo.py prepare
      - name: Prepare isolated Python and Cairo without Ubuntu package downloads
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # CI-only environment: never installed on the Thor or added to the release.
          # Miniconda is preinstalled on GitHub's ubuntu-24.04 image.
          conda_bin="${CONDA:-/usr/share/miniconda}/bin/conda"
          if [[ ! -x "$conda_bin" ]]; then
            echo '::error::The runner does not provide the expected Miniconda executable.'
            exit 1
          fi
          ci_env="${RUNNER_TEMP:?RUNNER_TEMP is required}/thor-ergo-ci-python"
          "$conda_bin" create --yes --prefix "$ci_env" \
            --override-channels --channel conda-forge --strict-channel-priority \
            'python=3.12' 'pycairo=1.25.1'
          "$ci_env/bin/python" -B - <<'PY'
          import cairo
          import io
          import sys
          surface = cairo.ImageSurface(cairo.FORMAT_ARGB32, 16, 16)
          context = cairo.Context(surface)
          context.set_source_rgb(0.1, 0.2, 0.3)
          context.paint()
          output = io.BytesIO()
          surface.write_to_png(output)
          assert output.getvalue().startswith(b'\x89PNG\r\n\x1a\n')
          surface.finish()
          print('CI Python:', sys.version)
          print('Real Pycairo:', cairo.version, 'Cairo:', cairo.cairo_version_string())
          print('Native offscreen PNG drawing: OK')
          PY
          printf 'THOR_CI_PYTHON=%s\n' "$ci_env/bin/python" >> "$GITHUB_ENV"
      - name: Run isolated application checks
        shell: bash
        run: '"${THOR_CI_PYTHON:?}" -B distribution/Thor/selftest.py'
      - name: Check host installers without connecting to any device
        shell: bash
        run: |
          set -euo pipefail
          "${THOR_CI_PYTHON:?}" -B distribution/Documentation/verify_host_transfer.py
          "${THOR_CI_PYTHON:?}" -B distribution/Documentation/verify_windows_source.py
      - name: Verify staged files and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_thor_ergo.py publish
